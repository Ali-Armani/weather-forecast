<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
  <title>Weather Forecast</title>
</head>
<body>

  <div class="card">

    <div class="search">
      <input type="text" placeholder="Enter city name" spellcheck="false">
      <button><img src="assets/images/search.png" alt="search icon"></button>
    </div>

    <div class="error">
      <p>Invalid city name!</p>
    </div>

    <div class="weather">
      <img src="assets/images/rain.png" alt="rainy weather image" class="weather-icon">
      <h1 class="temp">
        22°C
      </h1>
      <h2 class="city">Berlin</h2>
      <div class="details">
        <div class="col">
          <img src="assets/images/humidity.png" alt="humidity image">
        </div>
        <div>
          <p class="humidity">50%</p>
          <p>Humidity</p>
        </div>
        <div class="col">
          <img src="assets/images/wind.png" alt="wind image">
        </div>
        <div>
          <p class="wind">15 km/h</p>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
